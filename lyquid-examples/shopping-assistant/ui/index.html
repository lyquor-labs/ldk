<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Shopping Assistant</title>
    <link rel="stylesheet" href="./styles.css?v=flow" />
</head>
<body>
    <div class="scanlines" aria-hidden="true"></div>
    <main class="app-shell">
        <nav id="revisionTree" class="revision-tree" aria-label="Shopping revision history" hidden>
            <span class="revision-tree-label">States</span>
            <div class="revision-tree-scroll">
                <div class="revision-tree-track" data-role="revisionTreeTrack"></div>
            </div>
            <div id="revisionTooltip" class="revision-tooltip" data-role="revisionTooltip" role="tooltip" hidden></div>
        </nav>
        <header class="topbar">
            <div>
                <p class="eyebrow">Lyquid Example</p>
                <h1>Shopping Assistant</h1>
            </div>
            <div id="hostStatus" class="status-pill">hosted Lyquid connected</div>
        </header>

        <section id="conversation" class="conversation" aria-live="polite"></section>

        <template id="runCardTemplate">
            <article class="conversation-card run-panel">
                <div class="panel-title-row">
                    <h2>Product Search</h2>
                </div>
                <div class="search-summary">
                    <div class="wide">
                        <span class="metric-label">Request</span>
                        <strong data-field="searchRequest">-</strong>
                    </div>
                    <div>
                        <span class="metric-label">Model</span>
                        <strong data-field="searchModel">-</strong>
                    </div>
                    <div>
                        <span class="metric-label">Candidate round</span>
                        <strong data-field="searchRound">-</strong>
                    </div>
                </div>
                <div class="run-summary">
                    <div>
                        <span class="metric-label">Scope</span>
                        <strong data-field="scopeId">-</strong>
                    </div>
                    <div>
                        <span class="metric-label">Status</span>
                        <strong data-field="scopeStatus">starting</strong>
                    </div>
                    <div>
                        <span class="metric-label">Candidates</span>
                        <strong data-field="candidateCount">-</strong>
                    </div>
                    <div>
                        <span class="metric-label">Next hint</span>
                        <strong data-field="nextHint">preparing</strong>
                    </div>
                </div>
                <div class="goal-summary">
                    <div>
                        <span class="metric-label">Requirements</span>
                        <p data-field="hardConstraints">None yet</p>
                    </div>
                    <div>
                        <span class="metric-label">Preferences</span>
                        <p data-field="softPreferences">None yet</p>
                    </div>
                </div>
                <ol class="steps" data-role="steps"></ol>
            </article>
        </template>

        <template id="resultCardTemplate">
            <details class="conversation-card result-panel" open>
                <summary class="panel-title-row result-summary">
                    <span>Recommendations</span>
                </summary>
                <p class="search-results-summary" data-role="searchSummary"></p>
                <div class="recommendation-list" data-role="recommendationList"></div>
                <details class="search-sources" data-role="sourceList" hidden></details>
                <div class="revision-feed" data-role="revisionFeed" aria-live="polite"></div>
            </details>
        </template>

        <form id="shoppingForm" class="composer">
            <div class="revision-bar composer-revision-bar" data-role="revisionBar" hidden>
                <label>
                    Feedback
                    <input data-role="revisionInput" type="text" spellcheck="true" placeholder="State a preference, or explain why you want different candidates" />
                </label>
                <div class="revision-actions">
                    <div class="revision-actions" data-role="choiceBar" hidden></div>
                    <button type="button" data-role="revisionSubmit">Send</button>
                </div>
                <p id="revisionStatus" class="status-message wide" aria-live="polite" hidden></p>
            </div>
            <div class="composer-main">
                <label>
                    Request
                    <textarea id="userRequest" rows="3" spellcheck="true" placeholder="I want to buy coffee gear">I want a useful coffee product for travel</textarea>
                </label>
                <button id="submitButton" class="primary-action" type="submit">search</button>
            </div>

            <p id="statusMessage" class="status-message" aria-live="polite" hidden></p>
        </form>
    </main>

    <script type="module" src="./app.js?v=search"></script>
</body>
</html>
