services:
  node:
    image: ${LYQUOR_NODE_IMAGE:-ghcr.io/lyquor-labs/lyquor-node:v0.4.4}
    pull_policy: always
    ports:
      - "10087:10087"
    volumes:
      - node-data:/opt

  setup-devnet:
    image: ${LYQUOR_TOOLS_IMAGE:-ghcr.io/lyquor-labs/lyquor-tools:v0.4.4}
    pull_policy: always
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        until curl --data '{}' --header 'content-type: application/json' -sf http://node:10087/lyquor.node.v1.NodeService/GetNodeInfo >/dev/null; do sleep 1; done
        curl --data '{}' --header 'content-type: application/json' -sf http://node:10087/lyquor.lyquid.v1.LyquidService/GetLyquidInfo | grep contract ||
          /usr/local/bin/shaker deploy --is-bartender --reference ${LYQUOR_BARTENDER_REFERENCE:-ghcr.io/lyquor-labs/lyquids:bartender-v0.4.4} --endpoint ws://node:10087/ws
        if [ "${LYQUOR_ACTIVATE_AVAILABILITY:-false}" = "true" ]; then
          /usr/local/bin/shaker availability activate --committee auto --threshold 1 --endpoint ws://node:10087/ws
        fi
    environment:
      - LYQUOR_ENDPOINT=ws://node:10087/ws
    depends_on:
      node:
        condition: service_started

volumes:
  node-data:
    external: false
